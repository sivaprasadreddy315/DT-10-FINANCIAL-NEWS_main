<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial News Sentiment Analysis</title>
  <style>
    /* Basic resets */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    .container {
      text-align: center;
      background: rgba(30, 30, 30, 0.9);
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 3em;
      color: #0f9b8e;
      margin-bottom: 20px;
      animation: glowText 2s ease-in-out infinite alternate;
    }

    @keyframes glowText {
      0% {
        text-shadow: 0 0 10px #0f9b8e, 0 0 20px #0f9b8e, 0 0 30px #0f9b8e;
      }
      100% {
        text-shadow: 0 0 20px #0f9b8e, 0 0 30px #0f9b8e, 0 0 40px #0f9b8e;
      }
    }

    .description {
      font-size: 1.2em;
      margin-bottom: 40px;
      color: #bbb;
      animation: fadeIn 3s ease-in-out;
    }

    .predict-btn {
      background: linear-gradient(45deg, #0f9b8e, #00bfae);
      color: white;
      padding: 20px 50px;
      font-size: 1.3em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s, box-shadow 0.3s;
      animation: fadeIn 4s ease-in-out;
    }

    .predict-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
    }

    .predict-btn:active {
      transform: translateY(0);
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #aaa;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Financial News Sentiment Analysis</h1>
    <p class="description">
      Get instant sentiment analysis for the latest financial news. Make data-driven decisions with ease.
    </p>
    <button class="predict-btn" onclick="window.location.href='/predict';">
      Predict Sentiment
    </button>
    <footer>
      <p>Powered by Advanced AI Technology</p>
    </footer>
  </div>
</body>
</html>
