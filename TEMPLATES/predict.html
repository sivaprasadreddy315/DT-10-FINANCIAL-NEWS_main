<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predict Sentiment</title>
  <style>
    body {
      background: transparent; /* Removed black background */
      color: #e6e6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden; /* Prevent scrollbars */
      position: relative;
    }
    .container {
      background: rgba(30, 30, 30, 0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      width: 50%;
      z-index: 1; /* Ensure container is above emojis */
      position: relative;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 1em;
      background: #1e1e1e;
      color: #e6e6fa;
      outline: none;
    }
    .btn {
      margin-top: 10px;
      padding: 10px 20px;
      background: #9370db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.2em;
    }
    .btn:hover {
      background: #7a5bb6;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #222;
      color: #fff;
      border-radius: 5px;
      font-size: 1.2em;
      display: none; /* Initially hidden */
    }
    /* Falling Emojis */
    .emoji {
      position: absolute;
      font-size: 24px;
      animation: fall linear infinite;
      user-select: none;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enter Your Financial News</h1>
    <form id="sentimentForm">
      <textarea id="message" placeholder="Enter your financial news here..." required></textarea>
      <button type="submit" class="btn">Analyze Sentiment</button>
    </form>

    <!-- Result Section -->
    <div class="result" id="result">
      <p><strong>Entered Text:</strong> <span id="enteredText"></span></p>
      <p><strong>Predicted Sentiment:</strong> <span id="predictedSentiment"></span></p>
    </div>
  </div>

  <!-- Falling Emojis Script -->
  <script>
    const emojis = ["💰", "💵", "💳", "📈", "📉", "💹", "💱", "🏦", "💲", "💸"];
    const numEmojis = 30;

    function createEmoji() {
      const emoji = document.createElement("div");
      emoji.classList.add("emoji");
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = `${Math.random() * 100}vw`;
      emoji.style.animationDuration = `${Math.random() * 3 + 2}s`;
      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 5000);
    }

    for (let i = 0; i < numEmojis; i++) {
      setTimeout(createEmoji, Math.random() * 2000);
    }

    setInterval(createEmoji, 1000);
  </script>

  <!-- Sentiment Form Handling -->
  <script>
    document.getElementById('sentimentForm').addEventListener('submit', function (e) {
      e.preventDefault(); // Prevent form submission

      // Get the entered text
      const message = document.getElementById('message').value;

      // Simulate sentiment analysis (replace with actual API call)
      const sentiment = analyzeSentiment(message);

      // Display the result
      document.getElementById('enteredText').textContent = message;
      document.getElementById('predictedSentiment').textContent = sentiment;
      document.getElementById('result').style.display = 'block';
    });

    // Mock sentiment analysis function (replace with actual API call)
    function analyzeSentiment(text) {
      // Simulate a positive, negative, or neutral sentiment
      const sentiments = ['Positive', 'Negative', 'Neutral'];
      return sentiments[Math.floor(Math.random() * sentiments.length)];
    }
  </script>
</body>
</html>
